name: Deploy del miniblog

on:
  push:
    branches: [main]
    paths:
      - '3Septiembre/miniblog/**'

jobs:
  probar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3Septiembre/miniblog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -v

  desplegar:
    needs: probar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 3Septiembre/miniblog
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - run: docker build -t ${{ secrets.DOCKER_USER }}/miniblog:latest .
      - run: docker push ${{ secrets.DOCKER_USER }}/miniblog:latest