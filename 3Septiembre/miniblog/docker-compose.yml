services:
  web:
    build: .
    ports:
      - "8080:5000"
    environment:
      - DB_HOST=db
      - DB_PASSWORD=demo
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=demo
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: